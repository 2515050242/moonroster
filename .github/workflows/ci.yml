name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: moon fmt --check
      - name: Check packages
        run: moon check --target wasm,wasm-gc,js --deny-warn
      - name: Run tests
        run: moon test --target wasm,wasm-gc,js --deny-warn
      - name: Build browser engine
        run: moon build cmd/web --target js --release
      - name: Run example
        run: moon run cmd/main
